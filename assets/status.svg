    <text x="24" y="124" class="pu">  │   <tspan class="txt b">⟳  L O O P   E N G I N E E R I N G   v4</tspan>   │</text>
    <text x="24" y="142" class="pu">  ╰─────────────────────────────────────────────╯</text>

    <text x="24" y="178"><tspan class="cy">  ◆ </tspan><tspan class="txt b">acme-api</tspan></text>
    <text x="24" y="198"><tspan class="dim">      session     </tspan><tspan class="txt b">12</tspan></text>
    <text x="24" y="216"><tspan class="dim">      last close  </tspan><tspan class="txt">2026-11-10T18:42:07-07:00</tspan></text>
    <text x="24" y="234"><tspan class="dim">      agent       </tspan><tspan class="txt">claude-opus-5-5</tspan></text>
    <text x="24" y="252"><tspan class="dim">      drift       </tspan><tspan class="ye">2 commit(s) since 9f3c2ab</tspan></text>

    <text x="24" y="288"><tspan class="cy">  ◆ </tspan><tspan class="txt b">context budget</tspan></text>
    <text x="24" y="308"><tspan class="dim">      BOOT.md  </tspan></text>
  </g>
  <rect x="150" y="296" width="216" height="15" rx="2" fill="#1e293b"/>
  <rect x="150" y="296" width="128" height="15" rx="2" fill="url(#fill)">
    <animate attributeName="width" values="0;128" dur="1.4s" fill="freeze"/>
  </rect>
  <g class="m">
    <text x="380" y="308"><tspan class="txt">4,712 / 8,000 chars</tspan><tspan class="dim">  ≈ 1178 tokens</tspan></text>

    <text x="24" y="344"><tspan class="cy">  ◆ </tspan><tspan class="txt b">tiers</tspan></text>
    <text x="24" y="364"><tspan class="dim">      BOOT.md           </tspan><tspan class="rd">HOT </tspan><tspan class="txt">    4,712 chars</tspan><tspan class="dim">  loaded every session</tspan></text>
    <text x="24" y="382"><tspan class="dim">      progress.md       </tspan><tspan class="ye">WARM</tspan><tspan class="txt">   31,904 chars</tspan><tspan class="dim">  read by section</tspan></text>
    <text x="24" y="400"><tspan class="dim">      codebase-map.md   </tspan><tspan class="ye">WARM</tspan><tspan class="txt">   22,315 chars</tspan><tspan class="dim">  read by section</tspan></text>
    <text x="24" y="418"><tspan class="dim">      decisions.md      </tspan><tspan class="cy">COLD</tspan><tspan class="txt">   18,077 chars</tspan><tspan class="dim">  pulled by D-###</tspan></text>
    <text x="24" y="436"><tspan class="dim">      traps.md          </tspan><tspan class="cy">COLD</tspan><tspan class="txt">    6,420 chars</tspan><tspan class="dim">  pulled by TRAP-###</tspan></text>

    <text x="24" y="472"><tspan class="cy">  ◆ </tspan><tspan class="txt b">next</tspan></text>
    <text x="24" y="492"><tspan class="dim">      START HERE   </tspan><tspan class="txt">T-041: Add idempotency keys to POST /payments</tspan></text>
    <text x="24" y="510"><tspan class="dim">      IDs indexed  </tspan><tspan class="txt">87</tspan></text>

    <text x="24" y="542"><tspan class="cy">  ◆ </tspan><tspan class="txt b">health  </tspan><tspan class="gr">✔ healthy</tspan><tspan class="dim">  (loop check for details)</tspan><tspan class="txt cursor">  ▍</tspan></text>
