<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 860 560" width="860" height="560" role="img" aria-label="loop status dashboard in a terminal">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1426"/>
      <stop offset="1" stop-color="#0a0e1c"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
      .dim { fill: #64748b; } .txt { fill: #e2e8f0; } .cy { fill: #38bdf8; } .gr { fill: #4ade80; }
      .ye { fill: #facc15; } .rd { fill: #f87171; } .b { font-weight: 700; } .pu { fill: #c4b5fd; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="860" height="560" rx="14" fill="url(#win)" stroke="#1e293b"/>
  <rect width="860" height="38" rx="14" fill="#141a30"/>
  <rect y="24" width="860" height="14" fill="#141a30"/>
  <circle cx="22" cy="19" r="6" fill="#f87171"/><circle cx="42" cy="19" r="6" fill="#facc15"/><circle cx="62" cy="19" r="6" fill="#4ade80"/>
  <text x="430" y="24" class="m dim" text-anchor="middle">acme-api: zsh</text>

  <g class="m">
    <text x="24" y="70"><tspan class="gr">➜</tspan><tspan class="cy"> acme-api</tspan><tspan class="txt"> loop status</tspan></text>

